name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/cblack34/twingate-mcp
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Copy the scanned main image to the release tag
        run: |
          creds="$GITHUB_ACTOR:$GITHUB_TOKEN"
          version="${GITHUB_REF_NAME#v}"
          src="docker://$IMAGE:sha-$GITHUB_SHA"
          dst="docker://$IMAGE:$version"
          want=$(skopeo inspect --raw --creds "$creds" "$src" | sha256sum | cut -d' ' -f1)
          if skopeo inspect --raw --creds "$creds" "$dst" > existing 2> err; then
            have=$(sha256sum < existing | cut -d' ' -f1)
            test "$have" = "$want" || { echo "::error::$version already published as sha256:$have, refusing to replace it with sha256:$want"; exit 1; }
            echo "$version already points at sha256:$want"
            exit 0
          fi
          grep -q 'manifest unknown' err || { cat err; exit 1; }
          skopeo copy --all --digestfile digest --src-creds "$creds" --dest-creds "$creds" "$src" "$dst"
          echo "$version $(cat digest)"
          test "$(cat digest)" = "sha256:$want"
