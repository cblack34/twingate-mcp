services:
  twingate-mcp:
    build: .
    image: twingate-mcp:local
    # Inside the container the server must bind all interfaces, so TWINGATE_MCP_HTTP_TOKEN
    # is required (the server refuses to start without it). Clients send it as a bearer token.
    command: ["serve", "--transport", "http", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
